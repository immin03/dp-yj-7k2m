/* Layout concept: a private request slip. Olive envelope at both ends, ivory form between, one question per sheet. */
:root {
  --ivory: #FBF7F1;
  --blush: #F8E6E0;
  --blush-end: #FBF2EC;
  --charcoal: #2C2523;
  --accent: #A45C62;
  --rose: #D9A69B;
  --grey-text: #6F625E;
  --line: #ECDFD8;
  --line-strong: #D2C0B8;
  --soft: #6B5A55;
  --line-blush: #E9CFC6;
  --page: var(--ivory);
  --kr: "SUIT", "Pretendard", -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  --serif: "Cormorant Garamond", "Times New Roman", serif;
  --gl: max(22px, env(safe-area-inset-left, 0px));
  --gr: max(22px, env(safe-area-inset-right, 0px));
  --ease: cubic-bezier(.3, .7, .3, 1);
  color-scheme: light;
}
:root[data-tone="blush"] { --page: var(--blush); }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--page);
  color: var(--charcoal);
  font-family: var(--kr);
  font-size: 16px;
  line-height: 1.7;
  word-break: keep-all;
  overflow-wrap: break-word;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  transition: background-color 300ms var(--ease);
}
* { box-sizing: border-box; }
button, input, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--rose); outline-offset: 2px; }

#app { min-height: 100%; display: flex; flex-direction: column; }
.sheet {
  flex: 1;
  display: flex;
  flex-direction: column;
  width: 100%;
  max-width: 480px;
  margin-inline: auto;
  padding-left: var(--gl);
  padding-right: var(--gr);
  padding-block: 18px 0;
  background: var(--ivory);
}
.sheet.blush { background: linear-gradient(180deg, var(--blush), var(--blush-end)); color: var(--charcoal); }

.top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  font-size: 11px;
  letter-spacing: .14em;
  line-height: 1.4;
}
.top .count { color: var(--grey-text); font-variant-numeric: tabular-nums; }
.blush .top .count { color: var(--soft); letter-spacing: .1em; }
.mast { position: relative; white-space: nowrap; }
.credit { display: block; margin-top: 6px; font-size: 10.5px; letter-spacing: .14em; color: var(--accent); white-space: nowrap; }
.mast .word { position: relative; display: inline-block; }
.mast .word::after {
  content: "";
  position: absolute;
  left: 0; right: 0; top: 52%;
  height: 1px;
  background: var(--rose);
  transform: scaleX(0);
  transform-origin: left;
}
.struck .mast .word::after { animation: strike 520ms 260ms var(--ease) forwards; }
@keyframes strike { to { transform: scaleX(1); } }

.progress { height: 1px; background: var(--line); margin-top: 14px; position: relative; }
.progress i {
  position: absolute; left: 0; top: -.5px; height: 2px;
  background: var(--accent);
  transition: width 350ms var(--ease);
}

.body { flex: 1; display: flex; flex-direction: column; min-width: 0; animation: rise 280ms var(--ease); }
.body.back { animation-name: rise-back; }
@keyframes rise { from { opacity: .25; transform: translateX(14px); } to { opacity: 1; transform: none; } }
@keyframes rise-back { from { opacity: .25; transform: translateX(-14px); } to { opacity: 1; transform: none; } }

/* Cover */
.cover-main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-block: 44px 36px; }
.dear { font-family: var(--serif); font-style: italic; font-size: 44px; line-height: 1.1; color: var(--accent); }
.ask { font-size: 29px; line-height: 1.42; font-weight: 500; letter-spacing: -.012em; margin: 26px 0 0; text-wrap: balance; }
.note { margin: 26px 0 0; color: var(--soft); font-size: 16px; line-height: 1.85; }
.sign { font-family: var(--serif); font-style: italic; font-size: 25px; margin-top: 26px; line-height: 1.2; }

.cta {
  display: flex; align-items: center; justify-content: center;
  width: 100%; min-height: 58px; padding: 0 18px;
  background: var(--accent); color: var(--ivory);
  font-size: 13px; letter-spacing: .15em;
  border-radius: 2px;
  transition: transform 140ms var(--ease), opacity 200ms, background-color 200ms;
}
.cta.kr { font-size: 16px; letter-spacing: 0; font-weight: 500; }
.cta:active { transform: scale(.985); }
.cta[disabled] { background: #DCCBC3; color: #FFFFFF; cursor: not-allowed; }
.foot { padding-block: 22px 26px; font-size: 10.5px; letter-spacing: .13em; line-height: 1.75; color: var(--soft); }
.foot em { display: block; font-family: var(--serif); font-size: 15px; letter-spacing: .01em; color: var(--accent); }

/* Question */
.q-head { padding-block: 30px 22px; }
.eyebrow { display: flex; align-items: baseline; gap: 10px; font-size: 11px; letter-spacing: .16em; color: var(--grey-text); line-height: 1; }
.eyebrow b { font-family: var(--serif); font-weight: 400; font-style: italic; font-size: 25px; letter-spacing: 0; color: var(--accent); font-variant-numeric: lining-nums; }
h1 { font-size: 26px; line-height: 1.42; font-weight: 500; letter-spacing: -.012em; margin: 14px 0 0; text-wrap: balance; }
.desc { margin: 8px 0 0; color: var(--grey-text); font-size: 15px; line-height: 1.65; }

/* Option list: menu-card rows rather than boxes */
.opts { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.opt {
  display: flex; align-items: center; gap: 12px; width: 100%;
  min-height: 58px; padding: 10px 2px;
  border-bottom: 1px solid var(--line);
  text-align: left; font-size: 16.5px; line-height: 1.45;
  transition: color 180ms, padding 220ms var(--ease);
}
.opt .label { flex: 1; min-width: 0; }
.opt .emo { font-size: 16px; margin-left: 5px; }
.mark {
  flex: none; width: 22px; height: 22px; border-radius: 50%;
  border: 1px solid var(--line-strong);
  display: grid; place-items: center;
  transition: background-color 180ms, border-color 180ms, transform 220ms var(--ease);
}
.mark svg { width: 12px; height: 12px; opacity: 0; transition: opacity 120ms; }
.opt.wrong { color: #A99A94; text-decoration: line-through; cursor: default; }
.opt.wrong .mark { opacity: .4; }
.opt[aria-pressed="true"] { color: var(--accent); font-weight: 500; padding-left: 8px; }
.opt[aria-pressed="true"] .mark { background: var(--accent); border-color: var(--accent); transform: scale(1.06); }
.opt[aria-pressed="true"] .mark svg { opacity: 1; }

/* Calendar */
.cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.cal-title { font-family: var(--serif); font-size: 26px; line-height: 1; font-variant-numeric: lining-nums; letter-spacing: .01em; }
.cal-title small { font-family: var(--kr); font-size: 13px; color: var(--grey-text); margin-left: 8px; }
.cal-btn { width: 46px; height: 46px; display: grid; place-items: center; font-family: var(--serif); font-size: 24px; color: var(--accent); }
.cal-btn[disabled] { color: #CFCBBF; cursor: default; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.dow { text-align: center; font-size: 11.5px; color: var(--grey-text); padding-block: 6px 8px; }
.dow.sun, .day.sun:not([disabled]):not([aria-pressed="true"]) { color: #A9685A; }
.day {
  aspect-ratio: 1; max-height: 54px; width: 100%;
  display: grid; place-items: center;
  font-family: var(--serif); font-size: 20px; font-variant-numeric: lining-nums tabular-nums;
}
.day span { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; transition: background-color 160ms, color 160ms, transform 200ms var(--ease); }
.day[disabled] { color: #CBC7BB; cursor: default; }
.day.today span { box-shadow: inset 0 0 0 1px var(--rose); }
.day[aria-pressed="true"] span { background: var(--accent); color: var(--ivory); transform: scale(1.05); }
.picked { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; min-height: 34px; }
.pick { display: inline-flex; align-items: center; gap: 7px; min-height: 34px; padding: 0 12px; border: 1px solid var(--line); border-radius: 99px; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.pick i { font-style: normal; color: var(--grey-text); }
.picked .none { font-size: 13.5px; color: var(--grey-text); align-self: center; }

/* Time */
.times { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.slot {
  min-height: 54px; border: 1px solid var(--line); border-radius: 2px;
  font-family: var(--serif); font-size: 21px; font-variant-numeric: lining-nums tabular-nums;
  transition: background-color 160ms, color 160ms, border-color 160ms;
}
.slot[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--ivory); }
.loc-tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.loc-tab { position: relative; min-height: 46px; font-size: 16.5px; color: var(--grey-text); margin-bottom: -1px; border-bottom: 2px solid transparent; }
.loc-tab[aria-selected="true"] { color: var(--accent); font-weight: 500; border-bottom-color: var(--accent); }
.loc-tab i { font-style: normal; font-size: 12.5px; margin-left: 5px; font-variant-numeric: tabular-nums; }
.times.gu .slot { font-family: var(--kr); font-size: 14.5px; min-height: 48px; letter-spacing: -.01em; }
.flex-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.chip { min-height: 44px; padding: 0 15px; border: 1px solid var(--line); border-radius: 99px; font-size: 14.5px; transition: background-color 160ms, color 160ms, border-color 160ms; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--ivory); }

/* Inputs */
.field { display: block; margin-top: 20px; }
.field > span { display: block; font-size: 14.5px; margin-bottom: 6px; color: var(--charcoal); }
.input, textarea {
  display: block; width: 100%;
  background: transparent;
  border: 0; border-bottom: 1px solid var(--line-strong); border-radius: 0;
  padding: 10px 0; font-size: 16px; line-height: 1.6;
  outline: 0; resize: none;
  transition: border-color 180ms;
  -webkit-appearance: none; appearance: none;
}
.input:focus-visible, textarea:focus-visible { outline: 0; }
.input:focus, textarea:focus { border-bottom-color: var(--accent); }
::placeholder { color: #8D8B82; opacity: 1; }
.big { border: 1px solid var(--line-strong); padding: 14px; min-height: 200px; border-radius: 2px; }
.big:focus { border-color: var(--accent); }
.quiet { margin-top: 12px; font-size: 13.5px; color: var(--grey-text); }

.more { display: inline-flex; align-items: center; min-height: 46px; margin-top: 10px; font-size: 14.5px; color: var(--accent); }
.more-box { animation: open 240ms var(--ease); }
@keyframes open { from { opacity: .3; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

.react {
  min-height: 26px; margin-top: 16px; font-size: 14.5px; line-height: 1.6;
  color: var(--charcoal);
  display: flex; gap: 9px; align-items: baseline;
}
.react:empty { display: none; }
.react::before { content: ""; flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--rose); transform: translateY(-2px); }
.react.pop { animation: pop 300ms var(--ease); }
@keyframes pop { from { opacity: .2; transform: translateY(5px); } to { opacity: 1; transform: none; } }

  function optionRow(field, o, i) {

  function calendarHtml() {
    var y = view.y, m = view.m, today = todayKey();
    var first = new Date(Date.UTC(y, m - 1, 1)).getUTCDay();

    var minHit = y === tp[0] && m === tp[1];

    var html = '<div class="cal-nav"><button type="button" class="cal-btn" id="cal-prev" aria-label="이전 달"' + (minHit ? ' disabled' : '') + '>‹</button>' +
      '<div class="cal-title">' + y + '.' + pad(m) + '</div>' +
      '<button type="button" class="cal-btn" id="cal-next" aria-label="다음 달"' + (maxHit ? ' disabled' : '') + '>›</button></div><div class="cal-grid">';
    DOW.forEach(function (d, i) { html += '<div class="dow' + (i === 0 ? ' sun' : '') + '">' + d + '</div>'; });
    for (var b = 0; b < first; b++) html += '<div></div>';
    for (var d = 1; d <= days; d++) {
      var key = y + '-' + pad(m) + '-' + pad(d);

      return '<button type="button" role="tab" class="loc-tab" data-tab="' + r + '" aria-selected="' + (r === locTab) + '">' + r + (n ? '<i>' + n + '</i>' : '') + '</button>';
    }).join('') + '</div><div class="times gu">' + AREAS[locTab].map(function (g) {

  function canAdvance() { return S.step !== 0 || S.a.dates.length > 0; }

    } else if (step.key === 'final') {

        '<label class="field"><span>못 드시는 음식이나 피하고 싶은 메뉴가 있나요?</span><input class="input" id="avoid" type="text" autocomplete="off" value="' + esc(a.avoidFoods) + '"></label>';

      '<div class="body' + (dir === 'back' ? ' back' : '') + '">' +

      body +

      '</div></main>';
    setBar(((S.step + 1) / STEPS.length) * 94);

    // Keep the first paint of a revisited question quiet: show the reaction without re-triggering noise.

  function toggle(arr, v) { var i = arr.indexOf(v); if (i > -1) arr.splice(i, 1); else arr.push(v); return i === -1; }

  function bindInput(id, set) {
    var el = document.getElementById(id);
    if (el) el.addEventListener('input', function () { set(el.value); persist(); paintNext(); });
  }

  function bindQ(step) {
    var a = S.a;
    if (step.key === 'date') {
      var cal = document.getElementById('cal'), picked = document.getElementById('picked');
      var refresh = function () { cal.innerHTML = calendarHtml(); };
      var after = function () { picked.innerHTML = pickedHtml(); persist(); paintReaction('date'); paintNext(); };
      cal.addEventListener('click', function (e) {
        var pv = e.target.closest('#cal-prev'), nx = e.target.closest('#cal-next'), day = e.target.closest('.day');
        if (pv && !pv.disabled) { view.m--; if (view.m < 1) { view.m = 12; view.y--; } refresh(); }
        else if (nx && !nx.disabled) { view.m++; if (view.m > 12) { view.m = 1; view.y++; } refresh(); }
        else if (day && !day.disabled) {
          var on = toggle(a.dates, day.dataset.d);
          day.setAttribute('aria-pressed', on);
          after();
        }
      });
      picked.addEventListener('click', function (e) {
        var b = e.target.closest('[data-rm]');
        if (!b) return;
        a.dates.splice(a.dates.indexOf(b.dataset.rm), 1);
        refresh(); after();
      });
    }
    if (step.key === 'location') {
      var loc = document.getElementById('loc'), lp = document.getElementById('loc-picked');
      var locAfter = function () { lp.innerHTML = locPickedHtml(); loc.innerHTML = locGridHtml(); persist(); paintReaction('location'); paintNext(); };
      loc.addEventListener('click', function (e) {
        var tab = e.target.closest('.loc-tab'), slot = e.target.closest('.slot');
        if (tab) { locTab = tab.dataset.tab; loc.innerHTML = locGridHtml(); }
        else if (slot) { toggle(a.locations, slot.dataset.l); locAfter(); }
      });
      lp.addEventListener('click', function (e) {
        var b = e.target.closest('[data-rm]');
        if (b) { a.locations.splice(a.locations.indexOf(b.dataset.rm), 1); locAfter(); }
      });
      document.getElementById('anywhere').addEventListener('click', function () {
        this.setAttribute('aria-pressed', toggle(a.locations, ANYWHERE));
        locAfter();
      });
    }
    if (step.key === 'time') {
      app.querySelectorAll('.slot, .chip').forEach(function (b) {
        b.addEventListener('click', function () {
          var isSlot = b.classList.contains('slot');
          var v = isSlot ? b.dataset.t : b.dataset.f;
          var on = toggle(isSlot ? a.slots : a.flex, v);
          b.setAttribute('aria-pressed', on);
          if (on && bandOf(v)) S.band = bandOf(v);
          persist(); paintReaction('time'); paintNext();
        });
      });
      bindInput('custom-time', function (v) { a.customTime = v; });
    }
    if (step.field) {
      document.getElementById('opts').addEventListener('click', function (e) {

        if (!b) return;

        persist(); paintReaction(step.key); paintNext();
      });
    }
    if (step.key === 'food') {

      bindInput('avoid', function (v) { a.avoidFoods = v; });
    }
    if (step.key === 'final') bindInput('final-note', function (v) { a.finalNote = v; });
    if (step.ph) {
      var bindC = function () { bindInput('c-' + step.key, function (v) { a.comments[step.key] = v; }); };
      bindC();
      var more = document.getElementById('more');
      if (more) more.onclick = function () {
        S.open[step.key] = true; persist();
        document.getElementById('more-wrap').innerHTML = commentField(step.key, step.ph, a.comments[step.key] || '');
        bindC();
        document.getElementById('c-' + step.key).focus();
      };
    }
  }

  /* ---------- Review ---------- */
  function timeList() {
    return S.a.slots.slice().sort().concat(S.a.flex, S.a.customTime.trim() ? [S.a.customTime.trim()] : []);
  }
  function summary() {
    var a = S.a, c = a.comments;
    return [
      { step: 0, en: 'DATES', label: '가능한 날짜', vals: a.dates.slice().sort().map(dateLabel), notes: [c.date] },
      { step: 1, en: 'TIMES', label: '가능한 시간', vals: timeList(), notes: [c.time] },

  function renderReview(errMsg) {

    }).join('');

  /* ---------- Submission ---------- */
  function newId() {
    var p = kstParts(), n = new Uint8Array(4);
    crypto.getRandomValues(n);
    var hex = Array.prototype.map.call(n, function (b) { return b.toString(16).padStart(2, '0'); }).join('').toUpperCase();
    return 'DP-' + p.year + p.month + p.day + '-' + hex;
  }
  function buildPayload(channel) {
    var a = S.a, now = new Date();
    return {
      schemaVersion: 1,
      submissionId: S.submissionId,
      createdAtKST: kstIso(now),
      createdAtUTC: now.toISOString(),
      invitee: 'Yunjin',
      requester: 'Minwoo',
      channel: channel,
      dates: a.dates.slice().sort(),
      times: { slots: a.slots.slice().sort(), flexible: a.flex.slice(), custom: a.customTime.trim() },
      locations: a.locations.slice(),
      moods: a.moods.slice(),
      foods: a.foods.slice(),
      atmospheres: a.atmospheres.slice(),
      missions: a.missions.slice(),
      comments: {
        date: a.comments.date.trim(), time: a.comments.time.trim(), location: (a.comments.location || '').trim(), mood: a.comments.mood.trim(),
        atmosphere: a.comments.atmosphere.trim(), mission: a.comments.mission.trim()
      },
      foodWish: a.foodWish.trim(),
      avoidFoods: a.avoidFoods.trim(),
      finalNote: a.finalNote.trim()
    };
  }

  var backend = (function () {
    if (!window.claude || !window.claude.use) return Promise.resolve(null);
    return Promise.all([window.claude.use('db'), window.claude.use('user')])
      .then(function (r) { return r[0] ? { db: r[0], user: r[1] } : null; })
      .catch(function () { return null; });
  })();
  function within(p, ms) {
    return Promise.race([p, new Promise(function (_, rej) { setTimeout(function () { rej({ code: 'timeout' }); }, ms); })]);
  }

  // Resolves true only after the stored document has been read back.
  function saveToStore() {
    return within(backend, 7000).catch(function () { return null; }).then(function (b) {
      if (!b) return false;
      return Promise.resolve(b.user && b.user.can ? b.user.can('data.write') : null).catch(function () { return null; }).then(function (can) {
        if (can === false) return false;
        var payload = buildPayload('claude-db');
        var ref = b.db.collection('requests').doc(S.submissionId);
        var attempt = function (retry) {
          return within(ref.set(payload), 10000).catch(function (e) {
            if (retry && e && (e.code === 'unavailable' || e.code === 'timeout')) {
              return new Promise(function (r) { setTimeout(r, 700); }).then(function () { return attempt(false); });
            }
            throw e;
          });
        };
        return attempt(true)
          .then(function () { return within(ref.get(), 8000); })
          .then(function (snap) { return !!(snap.exists && snap.data() && snap.data().submissionId === S.submissionId); });
      });
    }).catch(function () { return false; });
  }

  // Resolves true only when the server returns this submission's id.
  function saveToSupabase() {
    var attempt = function (retry) {
      var ctl = new AbortController();
      var timer = setTimeout(function () { ctl.abort(); }, 10000);
      return fetch(SB_URL, {
        method: 'POST', signal: ctl.signal,
        headers: { apikey: SB_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ payload: buildPayload('supabase') })
      }).then(function (res) {
        return res.ok ? res.json() : null;
      }).then(function (id) {
        clearTimeout(timer);
        return id === S.submissionId;
      }).catch(function () {
        clearTimeout(timer);
        if (!retry) return false;
        return new Promise(function (r) { setTimeout(r, 700); }).then(function () { return attempt(false); });
      });
    };
    return attempt(true);
  }

  function submit() {
    var btn = document.getElementById('send');
    btn.disabled = true;
    btn.textContent = '보내는 중…';
    if (!S.submissionId) S.submissionId = newId();
    persist();
    saveToSupabase().then(function (ok) {
      if (ok) { S.channel = 'supabase'; return go('done'); }
      return saveToStore().then(function (stored) {
        if (stored) { S.channel = 'claude-db'; go('done'); }
        else { S.channel = 'manual'; go('manual'); }
      });
    });
  }
  function plainText() {
    var lines = ['[DATE, PENDING. 윤진님의 답변]', ''];
    summary().forEach(function (r) {
      lines.push(r.label + ': ' + (r.vals.length ? r.vals.join(', ') : '선택 안 함'));
      r.notes.forEach(function (n) { if (n && n.trim()) lines.push('  · ' + n.trim()); });
    });
    var p = kstParts();
    lines.push('', 'ID ' + S.submissionId, p.year + '-' + p.month + '-' + p.day + ' ' + p.hour + ':' + p.minute + ' KST');
    return lines.join('\n');
  }

  function renderManual() {
    var text = plainText();
    app.innerHTML = '<main class="sheet">' + header('', 'ONE LAST STEP', 0) +
      '<div class="body">' +
      '<div class="q-head"><div class="eyebrow"><span lang="en">HAND DELIVERY</span></div><h1>우체통이 잠깐 막혔어요.</h1>' +
      '<p class="desc">답변이 아직 민우에게 전달되지 않았어요. 아래 내용을 복사해서 카카오톡으로 보내주시거나, 답변 다시 보기에서 한 번 더 보내주세요.</p></div>' +
      '<textarea class="slip" id="slip" readonly aria-label="민우에게 보낼 답변">' + esc(text) + '</textarea>' +
      '<p class="quiet" id="copy-state" role="status"></p>' +
      '<div class="spacer"></div>' +
      '<div class="stack"><button type="button" class="cta kr" id="copy">답변 복사하기</button>' +
      '<button type="button" class="cta kr ghost" id="sent" disabled>카카오톡으로 보냈어요 →</button>' +
      '<button type="button" class="text-btn" id="back-review">← 답변 다시 보기</button></div>' +
      '</div></main>';
    setBar(100);
    var slip = document.getElementById('slip'), st = document.getElementById('copy-state'), sent = document.getElementById('sent'), copy = document.getElementById('copy');
    function fallback() {
      slip.focus(); slip.select(); slip.setSelectionRange(0, slip.value.length);
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      finish(ok);
    }
    function finish(ok) {
      sent.disabled = false;
      copy.textContent = ok ? '복사됐어요' : '다시 복사하기';
      st.textContent = ok ? '이제 민우와의 카카오톡 대화창에 붙여넣어 주세요.' : '자동 복사가 막혔어요. 위 글을 길게 눌러 전체 선택 후 복사해 주세요.';
    }
    copy.onclick = function () {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(slip.value).then(function () { finish(true); }, fallback);
      } else { fallback(); }
    };
    sent.onclick = function () { go('done'); };
    document.getElementById('back-review').onclick = function () { go('review'); };
  }

  /* ---------- Done ---------- */
  function cookieHtml(animate) {
    return '<div class="fortune-wrap">' +
      '<p class="fortune"' + (animate ? '' : ' style="animation:none"') + '>' + COOKIES[S.cookie] + '</p></div>';
  }
  function renderDone() {
    var label = S.channel === 'manual' ? 'REQUEST SENT.' : 'REQUEST RECEIVED.';
    app.innerHTML = '<main class="sheet blush">' + header('MADE BY MINWOO', 'FOR YUNJIN', null, true) +
      '<div class="body">' +
      '<div class="done-main"><div class="received" lang="en">' + label + '</div>' +
      '<h1 class="done-title">윤진님,<br>접수 완료입니다.</h1>' +
      '<p class="note">이제 민우가 잘할 차례네요.<br>좋은 하루 하나 준비해 보겠습니다.</p>' +
      '<div class="sign" lang="en">— Minwoo</div></div>' +
      '<section class="cookie"><h2 lang="en">YOUR LUCKY DATE COOKIE</h2><div id="cookie-slot">' +
      (S.cookie === null ? '<button type="button" class="cta kr" id="open-cookie">오늘의 쿠키 열어보기</button>' : cookieHtml(false)) +
      '</div></section>' +
      '<div class="done-foot"><button type="button" id="amend">답변 고치기</button></div>' +
      '</div></main>';
    var open = document.getElementById('open-cookie');
    if (open) open.onclick = function () {
      var r = new Uint32Array(1);
      crypto.getRandomValues(r);
      S.cookie = r[0] % COOKIES.length;
      persist();
      document.getElementById('cookie-slot').innerHTML = cookieHtml(true);
    };
    document.getElementById('amend').onclick = function () { go('review'); };
  }

  function start() { render(); }
  start();
})();
</script>
</body></html>
